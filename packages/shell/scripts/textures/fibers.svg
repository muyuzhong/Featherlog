<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512">
  <!-- Fine paper grain plus faint horizontal fibres; tiles seamlessly. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="4" stitchTiles="stitch" seed="2"/>
    <feColorMatrix values="0 0 0 0 .36  0 0 0 0 .25  0 0 0 0 .12  0 0 0 .16 0"/>
  </filter>
  <filter id="fibre" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".05 .22" numOctaves="3" stitchTiles="stitch" seed="9"/>
    <feColorMatrix values="0 0 0 0 .40  0 0 0 0 .28  0 0 0 0 .14  0 0 0 .7 -.47"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#grain)"/>
  <rect width="100%" height="100%" filter="url(#fibre)"/>
</svg>
