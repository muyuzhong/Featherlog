<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500">
  <!-- Large, soft age stains; used once per page, not tiled. -->
  <filter id="s" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".0045" numOctaves="4" seed="17"/>
    <feColorMatrix values="0 0 0 0 .52  0 0 0 0 .34  0 0 0 0 .12  .9 0 0 0 -.46"/>
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <filter id="spots" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="4"/>
    <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .28  0 0 0 0 .1  3 0 0 0 -1.95"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#s)"/>
  <rect width="100%" height="100%" filter="url(#spots)" opacity=".5"/>
</svg>
