name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: --linux --x64
          - os: windows-latest
            target: --win --x64
          - os: macos-latest
            target: --mac --arm64 --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - name: Verify release version
        shell: bash
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("packages/shell/package.json", "utf8"));
            if (process.env.GITHUB_REF_NAME !== `v${version}`) {
              throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match v${version}`);
            }
          '
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:app
      - name: Package and upload to draft release
        run: pnpm --filter @featherlog/shell exec electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
